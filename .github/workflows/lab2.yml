name: CI Workflow
run-name: "${{ github.actor }} triggered ${{ github.event_name }} on branch ${{ github.head_ref || github.ref_name }}"

on:
 push:
  branches:
   - main
 pull_request:
  branches:
   - main
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: printing repo detials
        run: ls

  second-job:
    runs-on: ubuntu-latest
    steps:
      - name: cutome message
        run: echo "hey hello"

